[package]
name = "keyfree-policy"
description = "Keyfree policy: a keyless NEAR contract that deploys and upgrades EVM contracts for an AI agent under council rules, signed by NEAR MPC"
version = "0.17.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/worksOnMyFridge/keyfree"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Reproducible build (NEP-330): `cargo near build reproducible-wasm` builds in this exact image, identified
# by its digest, so anyone with Docker gets the same wasm and sha256 on any machine.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
# KF_BUILD names the build in get_status; its value is recorded in the contract's source metadata.
passed_env = ["KF_BUILD"]
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = { version = "5.29", features = ["unstable"] }
omni-transaction = { version = "0.5.0", default-features = false, features = ["evm"] }
hex = "0.4"
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unstable", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
