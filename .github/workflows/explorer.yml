# The explorer page in the browsers people use: Chromium, Firefox and WebKit (Safari's engine), with stubbed nodes
# that fail on purpose, then once through the real public nodes. Read-only: no keys, no secrets.
name: explorer

on:
  workflow_dispatch:
  push:
    paths: ["explorer/**", ".github/workflows/explorer.yml"]

permissions:
  contents: read

jobs:
  browsers:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: explorer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Stubbed nodes
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm test
      - name: The real policy through the real nodes
        env:
          BROWSER: ${{ matrix.browser }}
          LIVE: "1"
        run: node --test --test-name-pattern="real policy" --test-timeout=180000 explorer.test.mjs
