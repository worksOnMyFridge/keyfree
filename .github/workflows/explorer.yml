# The site's pages (home, explorer, challenge, own policy) in the browsers people use: Chromium, Firefox and WebKit (Safari's engine),
# with stubbed nodes that fail on purpose, then the explorer once through the real public nodes. Nothing here
# sends a transaction; the only key is the one the challenge publishes on purpose.
name: explorer

on:
  workflow_dispatch:
  push:
    paths: ["explorer/**", "index.html", "start/**", "challenge/index.html", "challenge/published-agent-key.json", ".github/workflows/explorer.yml"]

permissions:
  contents: read

jobs:
  browsers:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: explorer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Stubbed nodes
        env:
          BROWSER: ${{ matrix.browser }}
          SHOTS: shots
        run: mkdir -p shots && npm test
      - name: The real policy through the real nodes
        env:
          BROWSER: ${{ matrix.browser }}
          LIVE: "1"
        run: node --test --test-name-pattern="real policy" --test-timeout=180000 explorer.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shots-${{ matrix.browser }}
          path: explorer/shots
          if-no-files-found: warn
