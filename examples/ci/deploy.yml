# An example for your own repository: copy it to .github/workflows/deploy.yml. It deploys one contract through a
# Keyfree policy. The job holds no EVM key, only the agent's NEAR function-call key (the KEYFREE_AGENT_KEY secret),
# which can ask the policy and nothing else. Change the constructor arguments to anything the council did not allow
# and the job fails with "Refused by the policy", before anything is signed. See README.md next to this file.
name: deploy

on:
  workflow_dispatch:
    inputs:
      args:
        description: Constructor arguments, as a JSON array
        default: "[1]"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The secret lives in an environment. Protect it, or it reaches any branch's workflow: in Settings >
    # Environments > testnet, allow deployments from main only and add a required reviewer.
    environment: testnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: worksOnMyFridge/keyfree
          # A commit of this repository you have read (here: the v20 tool). Never a branch: whoever can push to it
          # would run code next to your agent key.
          ref: 29fa5c886b8d9838011cf80c3e4f082ca88fdc2e
          path: .keyfree
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the keyfree tool
        working-directory: .keyfree/packages/keyfree
        run: npm ci --ignore-scripts && npm run build
      - name: Deploy through the policy
        env:
          KEYFREE: .keyfree/packages/keyfree/dist/cli.js
          CONFIG: keyfree.json
          CHAIN: base-sepolia
          ARTIFACT: out/Counter.sol/Counter.json
          ARGS: ${{ inputs.args }}
          AGENT_KEY_JSON: ${{ secrets.KEYFREE_AGENT_KEY }}
        run: bash .keyfree/examples/ci/keyfree-deploy.sh
