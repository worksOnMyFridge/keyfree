# gitleaks rules for this repository: the default set plus NEAR account keys.
# Public keys (about 44 base58 characters after "ed25519:") are fine to publish; a secret key is 64 bytes,
# about 88 characters, and must never appear.
[extend]
useDefault = true

[[rules]]
id = "near-ed25519-secret-key"
description = "NEAR ed25519 secret key"
regex = '''ed25519:[1-9A-HJ-NP-Za-km-z]{80,90}'''
keywords = ["ed25519:"]

# Public values the generic rule mistakes for secrets: EVM addresses (20 bytes) and base58 strings of 32 bytes
# (NEAR public keys, transaction and block hashes). A secret key is 64 bytes and is not covered.
[[allowlists]]
description = "public addresses, public keys and hashes"
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''', '''^[1-9A-HJ-NP-Za-km-z]{43,44}$''']

# The open challenge publishes one testnet function-call key on purpose (challenge/README.md). Only this file.
[[allowlists]]
description = "the agent key published for the open challenge"
paths = ['''^challenge/published-agent-key\.json$''']

# The live run's log prints the code hash the MCP tool returned; "key" in the tool's name trips the generic rule.
# Only this line of this log: a bare 32-byte hex value elsewhere could be a private key and must still be flagged.
[[allowlists]]
description = "the public code hash in the tool's live log"
condition = "AND"
paths = ['''^evidence/tool_live\.log$''']
regexTarget = "line"
regexes = ['''OK   keyfree_code_hash: [0-9a-f]{64}''']
